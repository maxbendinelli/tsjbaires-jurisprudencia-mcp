[project]
name = "tsjbaires-jurisprudencia-mcp"
version = "0.1.0"
description = "Servidor MCP para buscar y consultar jurisprudencia del Tribunal Superior de Justicia de la Ciudad Autónoma de Buenos Aires (tsjbaires.gob.ar)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "olefile>=0.47",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
tsjbaires-mcp = "tsjbaires_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsjbaires_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

